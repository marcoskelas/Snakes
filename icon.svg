<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a1478"/>
      <stop offset="1" stop-color="#0c0520"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c7c"/>
      <stop offset="1" stop-color="#b3002e"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6ff2e"/>
      <stop offset="1" stop-color="#22c08a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- rejilla neón -->
  <g stroke="#22f0ff" stroke-opacity=".14" stroke-width="2">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <!-- serpiente rodeando la seta -->
  <path d="M96 410 C 60 330, 120 300, 176 330 S 300 420, 360 380 S 450 280, 400 230"
        fill="none" stroke="url(#snake)" stroke-width="44" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M96 410 C 60 330, 120 300, 176 330 S 300 420, 360 380 S 450 280, 400 230"
        fill="none" stroke="#0c3a10" stroke-opacity=".35" stroke-width="44" stroke-dasharray="6 26" stroke-linecap="round"/>
  <!-- cabeza -->
  <ellipse cx="398" cy="214" rx="44" ry="36" fill="#8ff04a" filter="url(#glow)"/>
  <circle cx="386" cy="202" r="9" fill="#fff7a0"/><ellipse cx="386" cy="202" rx="3" ry="8" fill="#111"/>
  <circle cx="416" cy="202" r="9" fill="#fff7a0"/><ellipse cx="416" cy="202" rx="3" ry="8" fill="#111"/>
  <path d="M440 222 l26 -6 m-26 6 l24 12" stroke="#ff2e88" stroke-width="5" stroke-linecap="round"/>
  <!-- seta -->
  <rect x="210" y="236" width="76" height="110" rx="30" fill="#fff0dc"/>
  <path d="M120 250 C 120 130, 376 130, 376 250 Z" fill="url(#cap)" filter="url(#glow)"/>
  <circle cx="192" cy="200" r="20" fill="#fff" fill-opacity=".9"/>
  <circle cx="262" cy="172" r="16" fill="#fff" fill-opacity=".9"/>
  <circle cx="318" cy="214" r="18" fill="#fff" fill-opacity=".9"/>
  <circle cx="236" cy="228" r="10" fill="#fff" fill-opacity=".9"/>
</svg>
